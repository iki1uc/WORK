<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ID — RESPO INDEX</title>

<style>
    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: monospace;
        text-align: center;
        padding-top: 5vh;
        letter-spacing: 2px;
    }

    .btn {
        display: inline-block;
        padding: 12px 22px;
        margin: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 18px;
        transition: 0.3s;
    }

    .work {
        background: #ffffff;
        color: #000;
        border: 2px solid #66ccff;
    }

    .fork {
        background: #000000;
        color: #fff;
        border: 2px solid #ff3333;
    }

    .go {
        background: #222;
        color: #0f0;
        border: 2px solid #0f0;
    }

    .ghi {
        background: #111;
        color: #ff0;
        border: 2px solid #ff0;
    }

    .layer {
        background: #333;
        color: #66ccff;
        border: 2px solid #66ccff;
    }
</style>
</head>

<body>

<h1>ID — RESPO INDEX</h1>

<!-- WORK (weiß) -->
<div class="btn work" onclick="location.href='WORK.html'">
    WORK — Weiß
</div>

<!-- FORK (schwarz) -->
<div class="btn fork" onclick="location.href='FORK.html'">
    FORK — Schwarz
</div>

<!-- Layer‑Schalter -->
<div class="btn layer" onclick="alert('Layer 7 aktiv — le')">
    Layer (le)
</div>

<!-- Global‑Schalter -->
<div class="btn go" onclick="alert('Global Orbit aktiv — go')">
    Global (go)
</div>

<!-- Graphic‑Index -->
<div class="btn ghi" onclick="alert('Graphic Index geladen — ghi')">
    Graphic Index (ghi)
</div>

<!-- Multi‑Orbit‑Go‑Signal -->
<div class="btn go" onclick="alert('Multi‑Orbit aktiviert — g o go go')">
    Orbit Go (g o go go)
</div>

</body>
</html>
