  --muted:#9a9a9a;
  --yellow:#ffff00;
  --cyan:#00ffff;
  --green:#39ff88;
  --red:#ff3355;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#0a0a0a;
    --surface:#111111;
    --surface2:#161616;
    --line:#2a2a2a;
    --text:#e8e8e8;

*{
  box-sizing:border-box;
}
html,body{
  background:var(--bg);
  color:var(--text);
}
body{
  font-family:'JetBrains Mono', ui-monospace, monospace;
}
input[type=range]{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  height:10px;
  background:#222;
  border:2px solid var(--line);
  width:100%;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;
  height:22px;
  background:var(--yellow);
  border:3px solid #000;
  cursor:pointer;
}
input[type=range].cyan::-webkit-slider-thumb{
  background:var(--cyan);
}
input[type=range].green::-webkit-slider-thumb{
  background:var(--green);
}
@keyframes sweep{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}
@keyframes blink{
  0%,100%{
    opacity:1
  }
  50%{
    opacity:.2
  }
}
@keyframes pulseDot{
  0%{
    box-shadow:0 0 0 0 rgba(57,255,136,.5);
  }
  100%{
    box-shadow:0 0 0 14px rgba(57,255,136,0);
  }
}
.radar-sweep{
  animation:sweep 4s linear infinite;
  transform-origin:center;
}
.blink{
  animation:blink 1.2s steps(2) infinite;
