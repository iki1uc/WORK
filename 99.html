  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.opacity-70 {
  opacity: 0.7;
}
.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
.backdrop-blur-sm {
  --tw-backdrop-blur: blur(4px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}
.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.duration-200 {
  transition-duration: 200ms;
}
:root {
  --bg: #050505;
  --surface: #0b0b0c;
  --surface-2: #111013;
  --line: #2a2616;
  --gold: #ffd700;
  --yellow: #ffe600;
  --magenta: #ff00e5;
  --green: #39ff6a;
  --red: #ff3355;
  --text: #ece5c8;
  --muted: #9a927a;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050505;
    --surface: #0b0b0c;
    --surface-2: #111013;
    --line: #2a2616;
    --gold: #ffd700;
    --yellow: #ffe600;
    --magenta: #ff00e5;
    --green: #39ff6a;
    --red: #ff3355;
    --text: #ece5c8;
    --muted: #9a927a;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
/* dezente Scanlines wie auf einem Terminal */
.scanlines {
  background-image: repeating-linear-gradient(
    0deg,
    rgba(255, 215, 0, 0.025) 0px,
    rgba(255, 215, 0, 0.025) 1px,
    transparent 1px,
    transparent 4px
  );
}
@keyframes led-puls {
  0%,
  100% {
    opacity: 1;
    box-shadow: 0 0 10px 2px currentColor;
  }
  50% {
    opacity: 0.45;
    box-shadow: 0 0 2px 0 currentColor;
  }
}
.led-aktiv {
  animation: led-puls 1.6s ease-in-out infinite;
}
@keyframes blink-caret {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
.caret-blink {
  animation: blink-caret 1s step-end infinite;
}
input[type="range"].misch-regler {
  -webkit-appearance: none;
  -moz-appearance: none;
       appearance: none;
  height: 10px;
  border: 1px solid var(--line);
  background: linear-gradient(
    90deg,
    var(--gold) 0%,
    var(--yellow) 50%,
    var(--magenta) 100%
  );
  outline: none;
  cursor: pointer;
}
input[type="range"].misch-regler::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 0;
  background: #050505;
  border: 3px solid var(--yellow);
  box-shadow: 0 0 12px rgba(255, 230, 0, 0.8);
  cursor: ew-resize;
}
input[type="range"].misch-regler::-moz-range-thumb {
  width: 26px;
  height: 26px;
  border-radius: 0;
  background: #050505;
  border: 3px solid var(--yellow);
  box-shadow: 0 0 12px rgba(255, 230, 0, 0.8);
  cursor: ew-resize;
}
.log-scroll::-webkit-scrollbar {
  width: 8px;
}
.log-scroll::-webkit-scrollbar-track {
  background: #0b0b0c;
}
.log-scroll::-webkit-scrollbar-thumb {
  background: #3a3418;
  border: 1px solid #050505;
}
.hover\:bg-\[var\(--gold\)\]:hover {
  background-color: var(--gold);
}
.hover\:bg-\[var\(--red\)\]:hover {
  background-color: var(--red);
}
.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:col-span-3 {
    grid-column: span 3 / span 3;
  }
  .sm\:inline {
    display: inline;
  }
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:text-\[13px\] {
    font-size: 13px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
